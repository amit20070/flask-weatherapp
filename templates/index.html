<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLASK-Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        input, select, button {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .weather-info {
            text-align: center;
        }
        .weather-info h2 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        .temp {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
        }
       .time {text-align: center;}
       
        .error {
            color: red;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FLASK-Weather App BY <B>AMIT</B></h1>
        
        <form method="POST">
            <input type="text" name="city" placeholder="Enter city name" required>
            <select name="units">
                <option value="metric">(°C)</option>
                <option value="imperial">(°F)</option>
            </select>
            <button type="submit">Get Weather</button>
        </form>

        {% if weather %}
        <div class="weather-info">
            <h2>{{ weather.city }}</h2>
            <p class="temp">{{ weather.temperature }}{{ weather.units }}</p>
            <p><strong>{{ weather.description }}</strong></p>
            
            <div class="time">
                <div class="Updated" >
                    <strong><b>Updated</b></strong>
                    <p><b>{{ weather.timestamp }}</b></p>
                </div>
            </div>
        </div>  
        {% endif %}

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
